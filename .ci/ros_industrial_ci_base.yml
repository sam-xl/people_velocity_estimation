############################################################
# A base configuration for Industrial CI
#
# Provides most settings needed for a CI/CD pipeline using
# industrial_ci with ROS/ROS2.
#
# Extend this in your .gitlab-ci.yml file to define the
# container image and any project specific settings (e.g. 
# the .repos file)
# 
# Based on: 
# https://github.com/ros-industrial/industrial_ci/issues/627
############################################################

.ros_industrial_ci_base:
  variables:
    # allows to authenticate with the registry. needs to be set as a CI/CD
    # variable in the gitlab settings for the project. can also be inherited
    # from the parent group(s). 
    DOCKER_AUTH_CONFIG: $DOCKER_AUTH_CONFIG

    # set the directory in which industrial_ci will perform its operations
    # by default the namespace of the repo is used as part of the path
    # this can result in very long paths, which can cause cryptic failures in tests
    BASEDIR: "/workspaces"

    # the ci already runs in a docker container, no further isolation is needed
    ISOLATION: "shell"

    # folder in which to save the cache (relative to $CI_PROJECT_DIR) (not related to ccache!)
    # also used to extract artifacts from
    CI_CACHE_DIR: ".ci_cache"

    # configure the ccache dir to enable ccache for any c++ code
    CCACHE_DIR: "${CI_PROJECT_DIR}/.ccache"

  # set up the caches, maximum of 4 can be defined
  # https://docs.gitlab.com/ee/ci/caching/

  # NOTICE: GitLab caching is DISABLED for now. The time savings were minimal and the runner constantly ran out of space.

  before_script:
    # fail fast if inherited variables are missing or incorrectly set
    - |
      . .ci/ci_validation.sh

      check_non_empty BASEDIR "${BASEDIR}"
      check_non_empty ISOLATION "${ISOLATION}"
      check_non_empty CI_CACHE_DIR "${CI_CACHE_DIR}"
      check_non_empty CCACHE_DIR "${CCACHE_DIR}"

      check_is_absolute_path BASEDIR "${BASEDIR}"

      check_not_root BASEDIR "${BASEDIR}"
      check_not_root CCACHE_DIR "${CCACHE_DIR}"

      check_is_relative_path CI_CACHE_DIR "${CI_CACHE_DIR}"

      check_no_parent_traversal CI_CACHE_DIR "${CI_CACHE_DIR}"
      check_no_parent_traversal CCACHE_DIR "${CCACHE_DIR}"

      echo "Required variables are present"

    # dependencies for industrial_ci
    - sudo apt-get -qq update && sudo apt-get -qq install bash coreutils git grep

    # use gitlab ci token to authenticate to dependencies in .repos
    - git config --add --global "url.${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/.insteadOf" "${CI_SERVER_URL}"
    - git config --add --global "url.${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/.insteadOf" "ssh://git@${CI_SERVER_HOST}:"
    - git config --add --global "url.${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/.insteadOf" "ssh://git@${CI_SERVER_HOST}/"

    # this branch combines two changes:
    #   - rosdep_fix: https://github.com/ros-industrial/industrial_ci/issues/876
    #   - recent_clang_version: allows to install clang version more recent than provided by the base image by installing
    #     installing the llvm repo. if the correct version is available does nothing.
    - git clone --quiet --depth 1 https://github.com/sam-xl/industrial_ci .industrial_ci -b rosdep_fix_and_recent_clang_versions

    # create the $BASEDIR folder as the docker user may noy be able to make it due to permissions
    - if [ ! -d "${BASEDIR}" ]; then sudo mkdir ${BASEDIR}; sudo chown -R $(id -u):$(id -g) ${BASEDIR}; fi

    # create the $CI_CACHE_DIR if no cache is present from previous steps
    - if [ ! -d "${CI_PROJECT_DIR}/${CI_CACHE_DIR}" ]; then mkdir ${CI_PROJECT_DIR}/${CI_CACHE_DIR}; fi

    # reinstantiate the cache by copying it back to the $BASEDIR
    #   note: if this command is changed, also update the `.cache_workspaces` handle in .ci/utils.yml
    - cp -a ${CI_PROJECT_DIR}/${CI_CACHE_DIR}/. ${BASEDIR}

    # Avoid vcs warnings about detached heads
    - git config --add --global "advice.detachedHead" "false"

  # remove the cache and artifacts folder (if present) as it could result in a nested workspaces
  script: .industrial_ci/gitlab.sh TARGET_WORKSPACE=". -${CI_CACHE_DIR}"
