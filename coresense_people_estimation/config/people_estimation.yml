# Parameters for the people_estimation node. The key below must match the
# fully-qualified node name, or none of these are applied.
/people_estimation:
  ros__parameters:
    # ── Topics ──────────────────────────────────────────────────────────────
    detections_topic: /riskam/person_detections
    # Must be depth registered to the colour frame (align_depth.enable: true on
    # the driver); the raw depth image has a different FOV and focal length.
    depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    cmd_vel_topic: /cmd_vel
    # Output, re-framed into target_frame (see below); nav2's social layer
    # listens here.
    people_topic: /people
    # Stamp pairing of detections and depth; same slop as riskam_node.
    sync_queue_size: 10
    sync_slop: 0.1

    # ── Depth read-out ──────────────────────────────────────────────────────
    # Percentile of the box's depth readings used when no torso keypoint is
    # usable; also the low end of the spread that sizes the depth sigma.
    depth_percentile: 10.0
    # Half-width in pixels of the patch sampled around each torso keypoint.
    keypoint_patch_radius: 3
    # Valid depth band in metres; readings outside it count as missing.
    # depth_min_m matches riskam.ml.depth.DEPTH_MIN_M.
    depth_min_m: 0.1
    depth_max_m: 3.0

    # ── Uncertainty model ───────────────────────────────────────────────────
    # Per-sample position sigma; feeds the velocity window test, the published
    # covariance and reliability.
    #
    # Anchor pixel sigma, as a fraction of the bounding box size.
    pixel_sigma_frac: 0.25
    # Depth sigma is the larger of (depth_spread_gain x measured depth spread)
    # and (depth_noise_coeff x z^2). 0.0014 suits a RealSense D435 at defaults.
    depth_spread_gain: 1.0
    depth_noise_coeff: 0.0014
    # Velocity variance in m^2/s^2 reported when the fit cannot produce one
    # (fewer than three samples, or all sharing a stamp).
    velocity_prior_variance: 1.0

    # ── Tracking, spike rejection and velocity ──────────────────────────────
    # Longest and shortest window in seconds (~20 and ~6 samples at 10 Hz).
    # Raise the floor for smoother output, lower it to react faster to stops.
    velocity_window_max_s: 2.0
    velocity_window_min_s: 0.6
    # Reduced chi-square above which the window shortens; 1 means "exactly as
    # noisy as expected". Lower for a more responsive, noisier estimate.
    velocity_window_chi2_max: 3.0
    # Fraction of the position sigma counted as frame-to-frame noise. Raise if
    # the window collapses during straight-line walking.
    velocity_window_sigma_scale: 0.25
    # Expected gait sway amplitude in metres. Floors the window at ~1 cycle.
    # Increase for smoother tracking, decrease for faster response to stops.
    velocity_gait_sigma_m: 0.03
    # Below this span of history in seconds the velocity is zero, with
    # velocity_prior_variance. Mirrors riskam kinematics' min_span_s.
    velocity_min_span_s: 0.3
    # Speeds below this, in m/s, publish as exactly zero. Mirrors riskam
    # kinematics' v_eps_ms.
    velocity_epsilon: 0.05
    # A track unseen for longer than this, in seconds, restarts its history.
    # Independent of spike_reset_timeout.
    velocity_max_gap_s: 0.5
    # Cap on stored samples per track; 60 covers velocity_window_max_s at
    # 30 Hz. Values below 3 are raised to 3.
    history_maxlen: 60
    # Upper bound in m/s on the apparent speed between consecutive accepted
    # readings of a track, robot rotation removed. Faster readings are rejected
    # and the last accepted position republished.
    max_person_speed: 2.5
    # Consecutive rejections before the sensor is believed again. 0 disables
    # the spike filter.
    spike_max_holds: 5
    # An accepted position older than this, in seconds, is no longer compared
    # against; the next reading is taken as truth.
    spike_reset_timeout: 1.0

    # Seconds after which the last cmd_vel counts as "robot stationary"; 0
    # disables the check.
    cmd_vel_timeout: 0.5

    # ── Confirmation ────────────────────────────────────────────────────────
    # Frames a ByteTrack id must be seen running before it is published (~0.3 s
    # at 10 Hz). 0 or 1 disables the gate; while it is on, detections with
    # track_id -1 are dropped.
    confirm_frames: 3
    # A track unseen for longer than this, in seconds, restarts its streak.
    # Must clear one detection interval; 0.5 s works down to ~2.5 Hz.
    confirm_reset_timeout: 0.5

    # ── Plausibility ────────────────────────────────────────────────────────
    # Rejects people printed on posters and screens by checking whether the
    # strip across the top of the box reads anything behind them.
    #
    # Fraction of the bounding box height, from its top, that the strip covers.
    background_strip_frac: 0.25
    # Depth past the person, in metres, for a return to count as background.
    # Matters in corridors, where the wall behind returns a depth.
    background_step_m: 0.3
    # Reject below this share of background pixels in the strip. Biased low:
    # a kept poster costs a phantom obstacle, a dropped person a collision.
    # 0 disables the gate.
    background_min_far_frac: 0.03
    # Strips with fewer valid pixels are never a rejection.
    background_min_pixels: 40
    # Consecutive failing frames before a track is suppressed. Raise if real
    # people blink out when nothing readable is behind their head.
    implausible_patience: 3
    # A track unseen for longer than this, in seconds, restarts its streak.
    # Keep longer than spike_reset_timeout, or a suppressed poster is re-admitted
    # on a fixed cycle.
    plausibility_reset_timeout: 2.0

    # ── Coasting ────────────────────────────────────────────────────────────
    # Carries a track the camera has lost forward on its last velocity, only
    # while its extrapolated position stays outside the image.
    #
    # Seconds a lost track is carried forward. Too short opens a hole in the
    # costmap when somebody is lost; too long plans around somebody who left.
    # 0 disables coasting.
    coast_max_s: 3.0
    # Inset from the image edge for the in-view test, in metres at the person's
    # range (0.25 is about half a body width). Wider than the image disables
    # the test, which is the safe direction.
    coast_in_view_margin_m: 0.25
    # 1-sigma error on the held velocity, in m/s; published as the
    # coast_position_sigma_m tag, scaled by the time coasted. Diagnostic only.
    coast_process_sigma: 0.3

    # ── Output ──────────────────────────────────────────────────────────────
    # Also publish the position and velocity covariances, sample count and
    # window length as tagnames/tags pairs, in the colour optical frame. nav2
    # ignores them.
    publish_covariance_tags: false
    # `reliability` scales nav2's social Gaussian: the product of a valid-depth
    # term, a keypoint-completeness term and a localisation term, each in [0, 1].
    #
    # Valid-depth fraction at which the depth term saturates.
    reliability_valid_frac_full: 0.5
    # Detected keypoints (of 17) at which the detection-quality term saturates.
    reliability_keypoints_full: 8.0
    # Position-covariance trace, in m^2, at which the localisation term is 0.5
    # (~0.29 m sigma per axis).
    reliability_sigma_scale: 0.25

    # ── Map transform ───────────────────────────────────────────────────────
    # World-fixed frame people are re-expressed in before publishing. Empty
    # disables the transform (no TF listener; output in the colour optical
    # frame, uncompensated) — an escape hatch for a rig with no TF tree.
    target_frame: map
    # Frame cmd_vel is expressed in; its origin is the centre of rotation.
    robot_base_frame: base_link
    # Seconds to block waiting for a TF at the message stamp. Also caps the
    # pipeline latency, as it runs inside the detection callback.
    transform_timeout: 0.1
    # Fall back to the latest transform when the stamped lookup fails, instead
    # of dropping the frame.
    allow_latest_transform_fallback: true
    # Drop messages that cannot be velocity-compensated (cmd_vel older than
    # cmd_vel_timeout) instead of assuming the robot is stationary.
    require_cmd_vel: false

    # ── Debug visualisation ─────────────────────────────────────────────────
    # Off creates no marker publisher or TF broadcaster. The launch file's
    # debug:= argument overrides this.
    debug: false
    # MarkerArray topic; "~/" resolves to /people_estimation/debug_markers.
    debug_topic: ~/debug_markers
    # Broadcast one TF frame per person at their map position, yawed along
    # their velocity.
    debug_person_frames: true
    # Also draw the untransformed input in the colour optical frame: a position
    # mismatch points at TF, a velocity-only mismatch at the compensation.
    debug_show_raw: true
    # Arrow length = speed x this many seconds of look-ahead.
    debug_velocity_scale: 1.0
    # Person sphere radius in metres; arrow and text sizes scale with it.
    debug_person_radius: 0.2
    # Marker lifetime in seconds; 0 keeps them forever.
    debug_marker_lifetime: 0.5
